  // 4〜10号と20号の開発高・開花直径は牛尾煙火製造所の公開値（概数）。
  // 2号は2.5号（80m / 50m）より一回り小さい概数。15号は10号と20号の中間。
  // 30号・40号は牛尾の表にないため、到達高と開花径の一般的な目安。
  // 視点は打上地点から 500m、目の高さ 1.6m。垂直画角 62°（フルサイズ約 20mm）。
  // 尺玉の中心は仰角約 31°、上端は約 41°。安静時の仰角は約 21°で、下に地面が残る。
  // 上向きは40号の上端（仰角約 65°）が画面に入るところまで。上げきると地面はフレームから外れる。
  // カメラの高さは目の位置のままなので、地面の下には潜らない。
  const GAUGES = {
    2: { label: '2号', height: 65, diameter: 40 },
    3: { label: '3号', height: 120, diameter: 100 },
    4: { label: '4号', height: 150, diameter: 120 },
    5: { label: '5号', height: 200, diameter: 150 },

  function travelRadius(speed, friction, life) {
    const f = Math.max(friction, 0.05)
    return (speed / f) * (1 - Math.exp(-f * life))
  }

  function scaleSpeeds(layer, k) {
    layer.speed *= k
  }

  function scaleNidan(spec, shellRadius, generation) {
    const frac = generation === 1 ? 0.2 : 0.1
    const target = shellRadius * frac
    const reach = travelRadius(spec.speed, spec.friction, spec.life)
    spec.speed *= target / Math.max(reach, 0.001)
    if (spec.nidan) scaleNidan(spec.nidan, shellRadius, generation + 1)
  }

  function bloomTime(layer) {
    if (!layer.nidan) return layer.life
    return layer.life * 0.46 + 0.45
  }

  RECIPES.forEach(recipe => {
    const gauge = GAUGES[recipe.gauge]
    let radius = 1
    recipe.layers.forEach(layer => {
      radius = Math.max(radius, travelRadius(layer.speed, layer.friction, bloomTime(layer)))
    })
    const k = (gauge.diameter * 0.5) / radius
    recipe.layers.forEach(layer => {
      scaleSpeeds(layer, k)
      if (layer.nidan) scaleNidan(layer.nidan, gauge.diameter * 0.5, 1)
    })
    recipe.bloomRadius = gauge.diameter * 0.5
  })

  const wind = { x: 0, y: 0, z: 0 }

  function ballistic(px, py, pz, vx, vy, vz, friction, t, wx, wy, wz, grav) {
    const g = grav == null ? GRAVITY : grav
    const f = Math.max(friction, 0.05)
    const e = Math.exp(-f * t)
    const wgy = wy + g / f
    return {
      x: px + wx * t - (vx - wx) * (e - 1) / f,
      y: py + wgy * t - (vy - wy - g / f) * (e - 1) / f,
      z: pz + wz * t - (vz - wz) * (e - 1) / f
    }
  }

  function velocityAt(vx, vy, vz, friction, t, wx, wy, wz, grav) {
    const g = grav == null ? GRAVITY : grav
    const f = Math.max(friction, 0.05)
    const e = Math.exp(-f * t)
    return {
      x: wx + (vx - wx) * e,
      y: wy + g / f + (vy - wy - g / f) * e,
      z: wz + (vz - wz) * e
    }
  }

  function at(s, t) {
    return ballistic(s.px, s.py, s.pz, s.vx, s.vy, s.vz, s.friction, t, s.wx, s.wy, s.wz, s.grav)
  }

  function vel(s, t) {
    return velocityAt(s.vx, s.vy, s.vz, s.friction, t, s.wx, s.wy, s.wz, s.grav)
  }

  function onSphere() {
    const z = Math.random() * 2 - 1
    const th = Math.random() * Math.PI * 2
    const r = Math.sqrt(Math.max(0, 1 - z * z))
    return { x: r * Math.cos(th), y: z, z: r * Math.sin(th) }
  }

  function inBall() {
    const d = onSphere()
    const r = Math.cbrt(Math.random())
    return { x: d.x * r, y: d.y * r, z: d.z * r }
  }

  const sparks = Array.from({ length: MAX }, () => ({ alive: false }))
  let sparkCursor = 0

  function alloc(kind) {
    const n = sparks.length
    for (let k = 0; k < n; k++) {
      const i = (sparkCursor + k) % n
      if (!sparks[i].alive) {
        sparkCursor = (i + 1) % n
        return resetSpark(sparks[i])
      }
    }
    if (kind !== 'flash') return null
    let best = null
    let bestScore = 0
    for (let i = 0; i < sparks.length; i++) {
      const s = sparks[i]
      if (!s.alive) continue
      let score = 0
      if (s.kind === 'smoke') score = 1000 + s.age
      else if (s.kind === 'ember') score = 500 + s.age
      else if (s.fading) score = 100 + s.age
      if (score > bestScore) {
        best = s
        bestScore = score
      }
    }
    return best ? resetSpark(best) : null
  }

  function resetSpark(s) {
    s.alive = true
    s.age = 0
    s.fading = false
    s.fadeAge = 0
    s.fadeDur = 0.85
    s.splitDone = false
    s.nidanDone = false
    s.crackleRolled = false
    s.willCrackle = false
    s.frozen = 0
    s.emberAcc = 0
    s.smokeAcc = 0
    s.grav = null
    s.kind = 'spark'
    s.ribbon = true
    s.head = true
    s.hot = 0.8
    s.seed = Math.random()
    s.headSize = 2.4
    s.crackle = 0
    s.nidan = null
    s.recipe = 0
    s.bright = 1
    s.radius = 0.2
    s.friction = 0.8
    s.life = 1
    s.noBurst = false
    s.fan = false
    s.fanStar = false
    s.crown = false
    s.senrin = null
    s.senrinDone = false
    s.tint = false
    s.tintHold = 0
    s.tintFade = 0
    s.fadeInDur = 2.4
    return s
  }

  function spawnSpark(opts) {
    const s = alloc(opts.kind)
    if (!s) return null
    s.px = opts.x
    s.py = opts.y
    s.pz = opts.z
    s.vx = opts.vx
    s.vy = opts.vy
    s.vz = opts.vz
    s.friction = opts.friction
    s.life = opts.life
    s.senrin = opts.flower || null
    s.senrinDone = false
    if ((opts.kind || 'spark') === 'spark' && !opts.fanStar && !opts.senrinCarrier) {
      const burn = s.life
      const glitterWas = burn * 0.52
      const dieWas = burn * 0.28
      s.life = burn * 0.48 + glitterWas * 2
      s.glitterAt = (burn * 0.48) / s.life
      s.endAt = burn * 0.72 + Math.random() * dieWas * 2
    } else {
      s.glitterAt = 0.48
      s.endAt = s.kind === 'spark' ? s.life : 0
    }
    s.r = opts.color[0]
    s.g = opts.color[1]
    s.b = opts.color[2]
    s.crown = !!opts.crown
    s.crownR = opts.crown ? opts.crown[0] : 0
    s.crownG = opts.crown ? opts.crown[1] : 0
    s.crownB = opts.crown ? opts.crown[2] : 0
    s.radius = opts.radius
    s.bright = opts.bright
    s.hot = opts.hot
    s.crackle = opts.crackle || 0
    s.nidan = opts.nidan || null
    s.fadeDur = opts.fadeDur == null ? 0.9 : opts.fadeDur
    s.kind = opts.kind || 'spark'
    const windScale = s.kind === 'smoke' ? 2.2 : 0.28
    s.ribbon = opts.ribbon === true
    s.trail = opts.trail || 0
    s.head = opts.head !== false
    s.headSize = opts.headSize == null ? 2.4 : opts.headSize
    s.recipe = opts.recipe || 0
    s.wx = wind.x * windScale
    s.wy = wind.y * windScale
    s.wz = wind.z * windScale
    return s
  }

  function tint(color) {
    const k = 0.86 + Math.random() * 0.28
    return [color[0] * k, color[1] * k, color[2] * k]
  }

  function circlePoints(cx, cy, radius, count, color) {
    const pts = []
    for (let i = 0; i < count; i++) {
      const th = (i / count) * Math.PI * 2
      pts.push({ x: cx + Math.cos(th) * radius, y: cy + Math.sin(th) * radius, z: 0, color })
    }
    return pts
  }

  function patternPoints(name) {
    if (name === 'smile') {
      const gold = [1, 0.78, 0.22]
      const white = [1, 0.98, 0.9]
      const pts = circlePoints(0, 0, 1, 100, gold)
      for (const side of [-1, 1]) {
        for (let i = 0; i < 10; i++) {
          const d = inBall()
          pts.push({
            x: side * 0.34 + d.x * 0.09,
            y: 0.28 + d.y * 0.09,
            z: d.z * 0.03,
            color: white,
            bright: 1.7
          })
        }
      }
      const mouth = 42
      const start = Math.PI * 1.15
      const end = Math.PI * 1.85
      for (let i = 0; i <= mouth; i++) {
        const th = start + (end - start) * (i / mouth)
        pts.push({ x: Math.cos(th) * 0.58, y: Math.sin(th) * 0.58, z: 0, color: white, bright: 1.65 })
      }
      return pts
    }
    if (name === 'saturn') {
      const gold = [1, 0.74, 0.22]
      const ring = [0.85, 0.95, 1]
      const pts = []
      for (let i = 0; i < 70; i++) {
        const d = inBall()
        pts.push({ x: d.x * 0.4, y: d.y * 0.4, z: d.z * 0.4, color: gold })
      }
      const tilt = 1.05
      const c = Math.cos(tilt)
      const s = Math.sin(tilt)
      for (let i = 0; i < 96; i++) {
        const th = (i / 96) * Math.PI * 2
        const x = Math.cos(th)
        const y0 = Math.sin(th)
        pts.push({ x, y: y0 * c, z: y0 * s, color: ring })
      }
      return pts
    }
    if (name === 'heart') {
      const color = [1, 0.28, 0.45]
      const raw = []
      let max = 0
      const count = 110
      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2
        const x = 16 * Math.sin(t) ** 3
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
        raw.push({ x, y })
        max = Math.max(max, Math.hypot(x, y))
      }
      return raw.map(p => ({ x: p.x / max, y: p.y / max, z: 0, color }))
    }
    if (name === 'star') {
      const color = [1, 0.86, 0.28]
      const verts = []
      for (let i = 0; i < 10; i++) {
        const th = Math.PI / 2 + (i * Math.PI) / 5
        const r = i % 2 === 0 ? 1 : 0.4
        verts.push({ x: Math.cos(th) * r, y: Math.sin(th) * r })
      }
      const pts = []
      const steps = 14
      for (let i = 0; i < 10; i++) {
        const a = verts[i]
        const b = verts[(i + 1) % 10]
        for (let k = 0; k < steps; k++) {
          const t = k / steps
          pts.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: 0, color })
        }
      }
      return pts
    }
    const outer = [1, 0.78, 0.3]
    const inner = [0.75, 0.95, 1]
    return [...circlePoints(0, 0, 1, 80, outer), ...circlePoints(0, 0, 0.58, 56, inner)]
  }

  function burstPattern(x, y, z, pvx, pvy, pvz, layer) {
    const yaw = Math.random() * Math.PI * 2
    const pitch = (Math.random() - 0.5) * Math.PI
    const roll = Math.random() * Math.PI * 2
    const cy = Math.cos(yaw)
    const sy = Math.sin(yaw)
    const cp = Math.cos(pitch)
    const sp = Math.sin(pitch)
    const cr = Math.cos(roll)
    const sr = Math.sin(roll)
    const turn = (x0, y0, z0) => {
      const x1 = x0 * cr - y0 * sr
      const y1 = x0 * sr + y0 * cr
      const z1 = z0
      const x2 = x1
      const y2 = y1 * cp - z1 * sp
      const z2 = y1 * sp + z1 * cp
      return {
        x: x2 * cy + z2 * sy,
        y: y2,
        z: -x2 * sy + z2 * cy
      }
    }
    patternPoints(layer.pattern).forEach((pt, index) => {
      const turned = turn(pt.x, pt.y, pt.z)
      const len = Math.hypot(turned.x, turned.y, turned.z)
      if (len < 0.02) return
      const j = layer.jitter == null ? 0.015 : layer.jitter
      const speed = layer.speed * len * (1 + (Math.random() * 2 - 1) * j)
      const color = pt.color || layer.color
      const k = 0.94 + Math.random() * 0.1
      const vx = pvx * 0.04 + (turned.x / len) * speed
      const vy = pvy * 0.04 + (turned.y / len) * speed
      const vz = pvz * 0.04 + (turned.z / len) * speed
      spawnSpark({
        x, y, z,
        vx, vy, vz,
        friction: layer.friction * (0.97 + Math.random() * 0.06),
        life: layer.life * (0.96 + Math.random() * 0.08),
        color: [color[0] * k, color[1] * k, color[2] * k],
        radius: layer.radius,
        bright: pt.bright || layer.bright,
        hot: layer.hot,
        crackle: 0,
        ribbon: false,
        trail: 0,
        head: true,
        headSize: pt.bright ? 4.4 : 3.6,
        fadeDur: layer.fadeDur == null ? 0.4 : layer.fadeDur
      })
      if (index % 3 === 0) spawnShapeSmoke(x, y, z, vx, vy, vz, layer)
    })
  }

  function randomFrame() {
    const ny = onSphere()
    const hint = Math.abs(ny.y) < 0.85 ? { x: 0, y: 1, z: 0 } : { x: 1, y: 0, z: 0 }
    let nx = {
      x: hint.y * ny.z - hint.z * ny.y,
      y: hint.z * ny.x - hint.x * ny.z,
      z: hint.x * ny.y - hint.y * ny.x
    }
    const nl = Math.hypot(nx.x, nx.y, nx.z) || 1
    nx = { x: nx.x / nl, y: nx.y / nl, z: nx.z / nl }
    const nz = {
      x: ny.y * nx.z - ny.z * nx.y,
      y: ny.z * nx.x - ny.x * nx.z,
      z: ny.x * nx.y - ny.y * nx.x
    }
    return { nx, ny, nz }
  }

  function worldDir(frame, local) {
    return {
      x: frame.nx.x * local.x + frame.ny.x * local.y + frame.nz.x * local.z,
      y: frame.nx.y * local.x + frame.ny.y * local.y + frame.nz.y * local.z,
      z: frame.nx.z * local.x + frame.ny.z * local.y + frame.nz.z * local.z
    }
  }

  function burstDirection(shape, frame) {
    let local
    if (shape === 'ball') local = inBall()
    else if (shape === 'ring') {
      const th = Math.random() * Math.PI * 2
      const lift = (Math.random() - 0.5) * 0.12
      const radial = Math.sqrt(Math.max(0, 1 - lift * lift))
      local = { x: radial * Math.cos(th), y: lift, z: radial * Math.sin(th) }
    } else if (shape === 'fan') {
      const d = onSphere()
      d.y = -Math.abs(d.y) * 0.55 - 0.25
      const len = Math.hypot(d.x, d.y, d.z) || 1
      local = { x: d.x / len, y: d.y / len, z: d.z / len }
    } else if (shape === 'canopy') {
      const d = onSphere()
      d.y = Math.abs(d.y) * 0.55 + 0.22
      const len = Math.hypot(d.x, d.y, d.z) || 1
      local = { x: d.x / len, y: d.y / len, z: d.z / len }
    } else local = onSphere()
    if (frame && (shape === 'ring' || shape === 'fan')) return worldDir(frame, local)
    return local
  }

  function burstSenrin(x, y, z, pvx, pvy, pvz, layer) {
    for (let i = 0; i < layer.count; i++) {
      const dir = onSphere()
      const speed = layer.speed * (1 + (Math.random() * 2 - 1) * (layer.jitter || 0))
      spawnSpark({
        x, y, z,
        vx: pvx * 0.15 + dir.x * speed,
        vy: pvy * 0.15 + dir.y * speed,
        vz: pvz * 0.15 + dir.z * speed,
        friction: layer.friction,
        life: layer.life * (0.92 + Math.random() * 0.16),
        color: [0, 0, 0],
        radius: 0.01,
        bright: 0,
        hot: 0,
        crackle: 0,
        fadeDur: 0.05,
        trail: 0,
        ribbon: false,
        head: false,
        senrinCarrier: true,
        flower: layer.flower
      })
    }
  }

  function burstLayer(x, y, z, pvx, pvy, pvz, layer, frame) {
    if (layer.shape === 'pattern') {
      burstPattern(x, y, z, pvx, pvy, pvz, layer)
      return
    }
    if (layer.shape === 'senrin') {
      burstSenrin(x, y, z, pvx, pvy, pvz, layer)
      return
    }
    for (let i = 0; i < layer.count; i++) {
      const dir = burstDirection(layer.shape, frame)
      const speed = layer.speed * (1 + (Math.random() * 2 - 1) * layer.jitter)
      const vx = pvx * 0.22 + dir.x * speed
      const vy = pvy * 0.22 + dir.y * speed
      const vz = pvz * 0.22 + dir.z * speed
      spawnSpark({
        x, y, z,
        vx, vy, vz,
        friction: layer.friction * (0.9 + Math.random() * 0.2),
        life: layer.life * (0.88 + Math.random() * 0.24),
        color: tint(layer.color),
        radius: layer.radius,
        bright: layer.bright,
        hot: layer.hot,
        crackle: layer.crackle || 0,
        nidan: layer.nidan || null,
        fadeDur: layer.fadeDur == null ? 0.4 : layer.fadeDur,
        trail: layer.trail || 0,
        ribbon: (layer.trail || 0) > 0,
        headSize: layer.headSize,
        crown: layer.crown || null
      })
      if (i % 3 === 0) spawnShapeSmoke(x, y, z, vx, vy, vz, layer)
    }
  }

  let skyFlash = 0
  const labelEl = document.getElementById('label')
  window.addEventListener('error', event => {
    labelEl.textContent = event.message || '描画を開始できませんでした'
  })

  function bloomClip(recipe) {
    if (recipe.layers.some(layer => layer.nidan)) return 'decor'
    if ((GAUGES[recipe.gauge].height || 0) >= 300) return 'cannon'
    return 'bloom'
  }

  function explode(shell) {
    const age = Math.min(shell.age, shell.life)
    const p = at(shell, age)
    const v = vel(shell, age)
    const recipe = RECIPES[shell.recipe]
    const shaped = recipe.layers.some(layer => layer.shape === 'pattern')
    const senrin = recipe.layers.some(layer => layer.shape === 'senrin')
    const flashK = shaped ? 0.62 : 1
    const flare = senrin ? 2.6 : 1
    const bloom = recipe.bloomRadius || 40
    spawnSpark({
      x: p.x, y: p.y, z: p.z, vx: v.x, vy: v.y, vz: v.z,
      friction: 0.2, life: 0.06 * flare, color: [1, 0.98, 0.94], radius: bloom * 0.42 * flashK, bright: 1.6,
      hot: 1, kind: 'flash', ribbon: false, head: false, fadeDur: 0.1 * flare
    })
    spawnSpark({
      x: p.x, y: p.y, z: p.z, vx: v.x, vy: v.y, vz: v.z,
      friction: 0.15, life: 0.1 * flare, color: recipe.flash, radius: bloom * 0.9 * flashK, bright: shaped ? 0.7 : 1.15,
      hot: 1, kind: 'flash', ribbon: false, head: false, fadeDur: 0.17 * flare
    })
    skyFlash = Math.min(1.2, skyFlash + 0.9)
    const orient = recipe.layers.some(layer => layer.shape === 'ring' || layer.shape === 'fan') ? randomFrame() : null
    recipe.layers.forEach(layer => burstLayer(p.x, p.y, p.z, v.x, v.y, v.z, layer, orient))
    if (!senrin) spawnBurstSmoke(p.x, p.y, p.z, bloom)
    queueSound(p.x, p.y, p.z, 'bloom', bloom, bloomClip(recipe))
    const gauge = GAUGES[recipe.gauge]
    if (autoOn && gauge && gauge.height >= 250 && fanCooldown <= 0 && !fanQueue && Math.random() < 0.62) {
      launchSparkFan()
    }
    if (elapsed >= bannerUntil) {
      labelEl.textContent = recipe.name + '  ' + GAUGES[recipe.gauge].label
    }
  }

  function recipeWeight(recipe) {
    const gauge = recipe.gauge
    const pattern = recipe.layers.some(layer => layer.shape === 'pattern')
    if (gauge >= 10) return 0.4
    if (gauge <= 5) return pattern ? 1.1 : 2.8
    return 1
  }

  function pickRecipe() {
    let total = 0
    const weights = []
    for (let i = 0; i < RECIPES.length; i++) {
      const w = recipeWeight(RECIPES[i])
      weights.push(w)
      total += w
    }
    let roll = Math.random() * total
    for (let i = 0; i < weights.length; i++) {
      roll -= weights[i]
      if (roll <= 0) return i
    }
    return weights.length - 1
  }

  function risingSparkFraction(recipe) {
    if (recipe.name === '柳' || recipe.name === '椰子' || recipe.name === '孔雀' || recipe.name === '冠菊') return 0.92 + Math.random() * 0.08
    return 0.5 + Math.random() * 0.24
  }

  function estimateBurstHeight(vy, friction) {
    let y = 0.2
    for (let t = 0.05; t < 16; t += 0.05) {
      const v = velocityAt(0, vy, 0, friction, t, wind.x, wind.y, wind.z, null)
      const p = ballistic(0, 0.2, 0, 0, vy, 0, friction, t, wind.x, wind.y, wind.z, null)
      y = p.y
      if (t > 1.8 && v.y < 6) break
    }
    return y
  }

  function launchSpeedForHeight(height) {
    let lo = 30
    let hi = 180
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) * 0.5
      if (estimateBurstHeight(mid, 0.05) < height) lo = mid
      else hi = mid
    }
    return (lo + hi) * 0.5
  }

  function launch(x, z, recipeIndex, tilt, azimuth) {
    const recipe = recipeIndex == null ? pickRecipe() : recipeIndex
    const recipeObj = RECIPES[recipe]
    const gauge = GAUGES[recipeObj.gauge]
    const speed = launchSpeedForHeight(gauge.height) * (0.985 + Math.random() * 0.03)
    const tiltRad = tilt || 0
    const az = azimuth || 0
    const friction = 0.05
    let vx
    let vy
    let vz
    if (tiltRad > 0.001) {
      const horiz = speed * Math.sin(tiltRad)
      vy = speed * Math.cos(tiltRad)
      vx = Math.cos(az) * horiz + (Math.random() - 0.5) * 0.5
      vz = Math.sin(az) * horiz + (Math.random() - 0.5) * 0.5
    } else {
      vy = speed
      vx = -x * 0.015 + (Math.random() - 0.5) * 1.2
      vz = (Math.random() - 0.5) * 1.2
    }
    const shell = spawnSpark({
      x, y: 0.2, z,
      vx, vy, vz,
      friction,
      life: Math.max(9.2, gauge.height / 48),
      color: [1, 0.5, 0.14],
      radius: 0.24,
      bright: 0.9,
      hot: 0.95,
      kind: 'shell',
      ribbon: false,
      headSize: 3.4,
      fadeDur: 0.55,
      recipe
    })
    if (shell) {
      const burstY = estimateBurstHeight(vy, friction)
      shell.sparkStopY = Math.max(12, burstY * risingSparkFraction(recipeObj))
    }
    const longTail = recipeObj.layers.some(layer => (layer.trail || 0) >= 1.2)
    queueSound(x, 0.4, z, 'launch', gauge.height, longTail ? 'tail' : 'launch')
  }

  const SOUND_SPEED = 340
  let audioCtx = null
  let noiseBuffer = null
  let masterGain = null
  let reverb = null
  let soundOn = false
  const soundQueue = []

  function outdoorImpulse(ctx) {
    const rate = ctx.sampleRate
    const length = Math.floor(rate * 2.6)
    const buffer = ctx.createBuffer(2, length, rate)
    const left = buffer.getChannelData(0)
    const right = buffer.getChannelData(1)
    const echoes = [
      { t: 0.16, g: 0.46, pan: 0.22 },
      { t: 0.38, g: 0.3, pan: -0.48 },
      { t: 0.72, g: 0.16, pan: 0.5 },
      { t: 1.22, g: 0.08, pan: -0.28 },
      { t: 1.85, g: 0.035, pan: 0.18 }
    ]
    echoes.forEach(e => {
      const start = Math.floor(e.t * rate)
      const n = Math.floor(rate * (0.03 + e.t * 0.016))
      const lg = e.g * Math.sqrt(0.5 * (1 - e.pan))
      const rg = e.g * Math.sqrt(0.5 * (1 + e.pan))
      let lp = 0
      for (let i = 0; i < n; i++) {
        const idx = start + i
        if (idx >= length) break
        lp = lp * 0.9 + (Math.random() * 2 - 1) * 0.1
        const s = lp * Math.exp(-3.4 * i / n)
        left[idx] += s * lg
        right[idx] += s * rg
      }
    })
    let lpL = 0
    let lpR = 0
    const tailStart = Math.floor(0.18 * rate)
    for (let i = tailStart; i < length; i++) {
      const env = Math.exp(-((i / rate) - 0.18) * 1.15) * 0.055
      lpL = lpL * 0.965 + (Math.random() * 2 - 1) * 0.035
      lpR = lpR * 0.965 + (Math.random() * 2 - 1) * 0.035
      left[i] += lpL * env
      right[i] += lpR * env
    }
    let peak = 0
    for (let i = 0; i < length; i++) peak = Math.max(peak, Math.abs(left[i]), Math.abs(right[i]))
    const scale = peak > 0 ? 0.85 / peak : 1
    for (let i = 0; i < length; i++) {
      left[i] *= scale
      right[i] *= scale
    }
    return buffer
  }

  function audio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext
      if (!Ctx) return null
      audioCtx = new Ctx()
      masterGain = audioCtx.createGain()
      masterGain.gain.value = 0
      const comp = audioCtx.createDynamicsCompressor()
      comp.threshold.value = -14
      comp.knee.value = 10
      comp.ratio.value = 3
      comp.attack.value = 0.003
      comp.release.value = 0.18
      masterGain.connect(comp)
      comp.connect(audioCtx.destination)
      reverb = audioCtx.createConvolver()
      reverb.normalize = false
      reverb.buffer = outdoorImpulse(audioCtx)
      const reverbTone = audioCtx.createBiquadFilter()
      reverbTone.type = 'lowpass'
      reverbTone.frequency.value = 2600
      reverb.connect(reverbTone)
      reverbTone.connect(masterGain)
      const length = audioCtx.sampleRate * 2
      noiseBuffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate)
      const data = noiseBuffer.getChannelData(0)
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1
    }
    return audioCtx
  }

  function unlockAudio() {
    const ctx = audio()
    if (ctx && ctx.state === 'suspended') ctx.resume()
  }

  function queueSound(x, y, z, kind, size, clip) {
    soundQueue.push({ x, y, z, kind, size: size || 80, clip: clip || kind, at: performance.now() / 1000 })
    if (soundQueue.length > 64) soundQueue.shift()
  }

  function tone(ctx, when, dest, type, f0, f1, vol, attack, decay) {
    const osc = ctx.createOscillator()
    osc.type = type
    osc.frequency.setValueAtTime(Math.max(28, f0), when)
    osc.frequency.exponentialRampToValueAtTime(Math.max(24, f1), when + attack + decay)
    const g = ctx.createGain()
    g.gain.setValueAtTime(0.0001, when)
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), when + attack)
    g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay)
    osc.connect(g)
    g.connect(dest)
    osc.start(when)
    osc.stop(when + attack + decay + 0.02)
  }

  function noise(ctx, when, dest, filterType, freq, vol, attack, decay) {
    const src = ctx.createBufferSource()
    src.buffer = noiseBuffer
    const filter = ctx.createBiquadFilter()
    filter.type = filterType
    filter.frequency.setValueAtTime(freq, when)
    const g = ctx.createGain()
    g.gain.setValueAtTime(0.0001, when)
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), when + attack)
    g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay)
    src.connect(filter)
    filter.connect(g)
    g.connect(dest)
    src.start(when)
    src.stop(when + attack + decay + 0.02)
  }

  const CLIP = {
    launch: ['sounds/shot_01.ogg', 'sounds/shot_02.ogg'],
    mine: ['sounds/shot_03.ogg', 'sounds/shot_01.ogg'],
    bloom: ['sounds/bang_08.ogg', 'sounds/bang_02.ogg', 'sounds/fw_05.ogg'],
    boom: ['sounds/fw_04.ogg', 'sounds/cannon_02.ogg', 'sounds/fw_03.ogg']
  }
  const clips = { launch: [], mine: [], bloom: [], boom: [] }
  let clipsLoading = false
  let clipsReady = false

  function decodeBase64(ctx, b64) {
    const bin = atob(b64)
    const bytes = new Uint8Array(bin.length)
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
    return ctx.decodeAudioData(bytes.buffer)
  }

  function loadClips() {
    const ctx = audio()
    if (!ctx || clipsLoading) return
    clipsLoading = true
    const pack = window.HANABI_CLIPS
    const jobs = []
    if (pack) {
      Object.keys(pack).forEach(key => {
        pack[key].forEach(b64 => {
          jobs.push(decodeBase64(ctx, b64).then(buf => {
            clips[key].push(buf)
          }).catch(() => {}))
        })
      })
    } else {
      Object.keys(CLIP).forEach(key => {
        CLIP[key].forEach(url => {
          jobs.push(fetch(url).then(res => res.arrayBuffer()).then(buf => ctx.decodeAudioData(buf)).then(audioBuf => {
            clips[key].push(audioBuf)
          }).catch(() => {}))
        })
      })
    }
    Promise.all(jobs).then(() => {
      if (clips.bloom.length >= 3) {
        clips.tail = [clips.bloom[2]]
        clips.bloom = clips.bloom.slice(0, 2)
      }
      if (clips.boom.length >= 3) {
        clips.cannon = [clips.boom[1]]
        clips.decor = [clips.boom[2]]
      }
      clipsReady = true
    })
  }

  function pickClip(key) {
    const list = clips[key]
    if (!list || !list.length) return null
    return list[Math.floor(Math.random() * list.length)]
  }

  function playSound(s, remain, dist, pan) {
    if (!clipsReady) return false
    const ctx = audioCtx
    const when = ctx.currentTime + remain + Math.random() * 0.04
    const size = s.size
    const kindGain = s.kind === 'launch' ? 0.48 : s.kind === 'bloom' ? 1 : 0.7
    const vol = Math.min(1.15, (480 / Math.max(40, dist)) * kindGain)
    const panner = ctx.createStereoPanner()
    panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), when)
    const dry = ctx.createGain()
    dry.gain.setValueAtTime(1, when)
    panner.connect(dry)
    dry.connect(masterGain)
    let wet = null
    if (reverb) {
      wet = ctx.createGain()
      const open = s.kind === 'bloom' ? 1 : 0.42
      wet.gain.setValueAtTime(Math.min(0.28, (0.08 + dist / 4000) * open), when)
      panner.connect(wet)
      wet.connect(reverb)
    }
    const release = () => {
      try {
        panner.disconnect()
        dry.disconnect()
        if (wet) wet.disconnect()
      } catch (err) {}
    }
    const clipKey = s.clip || s.kind
    const recorded = pickClip(clipKey)
    if (recorded) {
      const src = ctx.createBufferSource()
      src.buffer = recorded
      src.playbackRate.setValueAtTime(0.94 + Math.random() * 0.12, when)
      const g = ctx.createGain()
      const clipVol = vol * (clipKey === 'cannon' ? 1 : clipKey === 'mine' ? 0.45 : 0.8)
      g.gain.setValueAtTime(clipVol, when)
      src.connect(g)
      g.connect(panner)
      src.onended = release
      src.start(when)
      return true
    }
    if (s.kind === 'launch') {
      tone(ctx, when, panner, 'sine', 82, 38, vol * 0.85, 0.01, 0.34)
      noise(ctx, when, panner, 'bandpass', 200, vol * 0.4, 0.004, 0.16)
    } else if (s.kind === 'mine') {
      tone(ctx, when, panner, 'sine', 120, 60, vol * 0.32, 0.006, 0.1)
      noise(ctx, when, panner, 'bandpass', 480, vol * 0.28, 0.003, 0.06)
    } else {
      const boom = Math.max(0.4, Math.min(1.4, 0.35 + size / 200))
      const start = Math.max(46, 230 - size * 0.85)
      noise(ctx, when, panner, 'highpass', 1000, vol * 0.5, 0.002, 0.045 + size / 900)
      tone(ctx, when, panner, 'sine', start, Math.max(30, start * 0.32), vol * 0.9, 0.012, boom)
      noise(ctx, when, panner, 'lowpass', 420, vol * 0.32, 0.01, boom * 0.75)
    }
    const marker = ctx.createBufferSource()
    marker.buffer = ctx.createBuffer(1, 1, ctx.sampleRate)
    marker.onended = release
    marker.start(when + 2.2)
    return true
  }

  function soundPan(dx, dy, dz, dist, remain) {
    if (camMode === 'heli') {
      const angle = heli.angle + Math.max(0, remain) * (Math.PI * 2 / 220)
      const s = Math.sin(angle)
      const c = Math.cos(angle)
      const vx = dx + camera.position.x - s * 2000
      const vz = dz + camera.position.z - c * 2000
      const vy = dy
      const vdist = Math.max(1, Math.hypot(vx, vy, vz))
      return (vx * c + vz * -s) / vdist
    }
    const e = camera.matrixWorld.elements
    return (dx * e[0] + dy * e[1] + dz * e[2]) / dist
  }

  function flushSounds() {
    if (!soundOn || !audioCtx || audioCtx.state !== 'running' || !camera) return
    const now = performance.now() / 1000
    const cam = camera.position
    for (let i = soundQueue.length - 1; i >= 0; i--) {
      const s = soundQueue[i]
      const dx = s.x - cam.x
      const dy = s.y - cam.y
      const dz = s.z - cam.z
      const dist = Math.max(1, Math.hypot(dx, dy, dz))
      const remain = dist / SOUND_SPEED - (now - s.at)
      if (clipsReady && remain < -0.2) {
        soundQueue.splice(i, 1)
        continue
      }
      if (!clipsReady) continue
      try {
        if (playSound(s, Math.max(0, remain), dist, soundPan(dx, dy, dz, dist, remain)) !== false) soundQueue.splice(i, 1)
      } catch (err) {
        soundQueue.splice(i, 1)
      }
    }
  }

  function spawnShapeSmoke(x, y, z, vx, vy, vz, layer) {
    const speed = Math.hypot(vx, vy, vz) || 1
    const reach = travelRadius(speed, layer.friction, bloomTime(layer))
    const puff = Math.min(reach * 0.08, 12)
    const placed = Math.max(0, reach - puff) * (0.55 + Math.random() * 0.45)
    spawnSmokePuff(
      x + (vx / speed) * placed,
      y + (vy / speed) * placed,
      z + (vz / speed) * placed,
      (Math.random() - 0.5) * 0.6,

  function spawnBurstSmoke(x, y, z, bloom) {

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })

    uniforms: { flash: { value: 0 } },
    vertexShader: `

        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vDir;

      void main() {
        float h = normalize(vDir).y;
        vec3 zenith = vec3(0.012, 0.016, 0.04);
        vec3 horizon = vec3(0.07, 0.045, 0.055);
        float lift = smoothstep(-0.05, 0.42, h);
        vec3 col = mix(horizon, zenith, lift);
        col += vec3(0.38, 0.18, 0.07) * flash * (1.0 - smoothstep(-0.02, 0.32, h));
        gl_FragColor = vec4(col, 1.0);

  })

  const groundFlashes = []

  const groundMat = new THREE.ShaderMaterial({
    uniforms: {
      flashes: { value: groundFlashes },
      cameraPos: { value: new THREE.Vector3() }
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      varying vec3 vWorld;
      uniform vec4 flashes[8];
      uniform vec3 cameraPos;
      void main() {
        vec3 base = vec3(0.027, 0.031, 0.051);
        float light = 0.0;
        vec3 toCam = cameraPos - vWorld;
        float camLen = inversesqrt(max(dot(toCam, toCam), 1.0));
        vec3 V = toCam * camLen;
        for (int i = 0; i < 8; i++) {
          float w = flashes[i].w;
          if (w <= 0.001) continue;
          vec3 toLight = flashes[i].xyz - vWorld;
          float dist2 = dot(toLight, toLight);
          vec3 L = toLight * inversesqrt(max(dist2, 1.0));
          float ndotl = max(L.y, 0.0);
          vec3 incident = -L;
          vec3 R = vec3(incident.x, -incident.y, incident.z);
          float spec = pow(max(dot(R, V), 0.0), 4.2);
          float atten = ndotl / (1.0 + dist2 / 65000.0);
          light += w * spec * atten;

        light = min(light, 0.45);
        vec3 col = base + vec3(0.34, 0.27, 0.2) * light;
        gl_FragColor = vec4(col, 1.0);

  const headMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      attribute float seed;
      varying vec3 vColor;
      varying float vSeed;
      varying float vSize;
      void main() {
        vColor = color;
        vSeed = seed;
        vSize = size;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(size, 1.0, 40.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec3 vColor;
      varying float vSeed;
      varying float vSize;
      void main() {
        vec2 uv = gl_PointCoord * 2.0 - 1.0;
        float d = dot(uv, uv);
        if (d > 1.0) discard;
        float ball = clamp((vSize - 8.0) / 14.0, 0.0, 1.0);
        float core = exp(-d * mix(5.5, 2.6, ball));
        float halo = pow(max(0.0, 1.0 - d), mix(3.0, 1.8, ball)) * mix(0.12, 0.42, ball);
        float tw = 0.82 + 0.18 * sin(uTime * (14.0 + vSeed * 36.0) + vSeed * 24.0);
        gl_FragColor = vec4(vColor * (core + halo) * tw, 1.0);
      }
    `,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    premultipliedAlpha: false
  })

  function spawnFanBloom(x, tilt, speed) {
    queueSound(x, 0.4, 0, 'mine', 40)
    const stars = 8
    for (let k = 0; k < stars; k++) {
      const th = tilt + (Math.random() - 0.5) * 0.14
      const sp = speed * (0.78 + Math.random() * 0.34)
      const gold = Math.random()
      const color = gold > 0.72 ? [1, 0.28, 0.22] : gold > 0.5 ? [1, 0.78, 0.28] : [1, 0.55, 0.12]
      const spark = spawnSpark({
        x, y: 0.4, z: (Math.random() - 0.5) * 1.2,
        vx: Math.sin(th) * sp,
        vy: Math.cos(th) * sp,
        vz: (Math.random() - 0.5) * sp * 0.06,
        friction: 1.05,
        life: 2.8 * (0.9 + Math.random() * 0.16),
        color,
        radius: 0.42,
        bright: 1.15,
        hot: 0.55,
        kind: 'spark',
        ribbon: true,
        trail: 0.64,
        head: true,

        fadeDur: 0.28
      })
      if (spark) {
        spark.fanStar = true
        spark.endAt = spark.life
      }
    }
  }

  function launchSparkFan() {
    const patterns = ['fan', 'seq-left', 'seq-right', 'diag-left', 'diag-right', 'split', 'cross']
    const pattern = patterns[Math.floor(Math.random() * patterns.length)]
    const count = 24
    const spacing = 10.2
    const span = 32 * Math.PI / 180
    const speed = 109 + Math.random() * 14
    const origin = (Math.random() - 0.5) * 24
    const xLeft = origin - ((count - 1) * spacing) / 2
    const items = []
    for (let i = 0; i < count; i++) {
      const u = count === 1 ? 0 : (i / (count - 1)) * 2 - 1
      let tilt = u * span
      let delay = 0
      if (pattern === 'seq-left') delay = i * 0.028
      else if (pattern === 'seq-right') delay = (count - 1 - i) * 0.028
      else if (pattern === 'diag-left') tilt = -0.5 + (Math.random() - 0.5) * 0.06
      else if (pattern === 'diag-right') tilt = 0.5 + (Math.random() - 0.5) * 0.06
      else if (pattern === 'split') tilt = (u < 0 ? -1 : 1) * (0.28 + Math.abs(u) * 0.22)
      else if (pattern === 'cross') tilt = (u < 0 ? 1 : -1) * (0.26 + Math.abs(u) * 0.2)
      items.push({ t: delay, x: xLeft + i * spacing, tilt, speed })
    }
    items.sort((a, b) => a.t - b.t)
    fanQueue = { items, index: 0, elapsed: 0 }
    fanCooldown = 6
    if (elapsed >= bannerUntil) {
      labelEl.textContent = 'スターマイン'
      bannerUntil = elapsed + 4
    }
  }

  function beginFade(s) {
    s.frozen = s.age
    s.fading = true
    s.fadeAge = 0
  }

  function updateWind(time) {
    wind.x = 2.0 + 0.25 * Math.sin(0.11 * time)
    wind.y = 0.12 * Math.sin(0.07 * time)
    wind.z = 0.35 * Math.sin(0.09 * time + 0.6)
  }

  function step(dt) {
    const aliveBefore = sparks.filter(s => s.alive)
    aliveBefore.forEach(s => {
      if (s.fading) {
        s.fadeAge += dt
        if (s.fadeAge >= s.fadeDur) s.alive = false
        return
      }
      s.age += dt
      if (s.kind === 'shell') {
        const here = at(s, s.age)
        const stillSparking = here.y < (s.sparkStopY || 1e9)
        if (stillSparking) {
          s.emberAcc += dt
          if (s.emberAcc > 0.028) {
            s.emberAcc = 0
            spawnEmber(s)
          }
          s.smokeAcc += dt
          if (s.smokeAcc > 0.14) {
            s.smokeAcc = 0
            spawnTrailSmoke(s)
          }
        } else {
          s.head = false
        }
        const v = vel(s, s.age)
        if (s.noBurst) {
          const sp = Math.hypot(v.x, v.y, v.z)
          if (s.age >= s.life || (s.age > 0.55 && sp < 9)) beginFade(s)
          return
        }
        if ((s.age > 1.8 && v.y < 6) || s.age >= s.life) {
          s.age = Math.min(s.age, s.life)
          explode(s)
          beginFade(s)
        }
        return
      }
      if (s.senrin && !s.senrinDone && s.age >= s.life) {
        s.senrinDone = true
        spawnSenrinFlower(s)
        s.alive = false
        return
      }
      if (s.nidan && !s.nidanDone && s.age > s.life * 0.46) {
        s.nidanDone = true
        spawnChildren(s, s.nidan)
        s.life = s.age + 0.45
        s.endAt = s.life
      }
      if (s.crackle > 0 && !s.crackleRolled && s.age > s.life * 0.2) {
        s.crackleRolled = true
        s.willCrackle = Math.random() < s.crackle
      }
      if (s.willCrackle && !s.splitDone && s.age > s.life * 0.72) {
        s.splitDone = true
        spawnChildren(s, {
          count: 4,
          speed: 3.2,
          friction: 2.1,
          life: 0.32,
          color: [1, 0.72, 0.35],
          radius: 0.16,
          bright: 1.2,
          hot: 1,
          headSize: 1.5
        })
      }
      if (s.fanStar) {
        const fv = vel(s, s.age)
        const sp = Math.hypot(fv.x, fv.y, fv.z)
        s.smokeAcc += dt
        if (s.smokeAcc > 0.88) {
          s.smokeAcc = 0
          if (Math.random() < 2 / 9) {
            const p = at(s, s.age)
            spawnSmokePuff(
              p.x, p.y, p.z,
              (Math.random() - 0.5) * 0.5,
              (Math.random() - 0.5) * 0.3,
              (Math.random() - 0.5) * 0.5,
              16 + Math.random() * 6,
              8 + Math.random() * 5,
              0.22,
              0.02,
              null,
              0.4
            )
          }
        }
        if (s.age >= s.life || (s.age > 0.45 && sp < 8)) {
          beginFade(s)
          return
        }
      }
      if (s.kind === 'spark' && s.endAt && s.age >= s.endAt) {
        s.fadeDur = 0.1 + Math.random() * 0.14
        beginFade(s)
        return
      }
      if (s.age >= s.life) {
        s.age = s.life
        beginFade(s)
      }
    })
  }

  function upload(time) {
    const cam = camera.position
    const world = camera.matrixWorld.elements
    const rightX = world[0]
    const rightY = world[1]
    const rightZ = world[2]
    const upX = world[4]
    const upY = world[5]
    const upZ = world[6]
    const height = renderer.domElement.height || window.innerHeight
    const focal = (height * 0.5) / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5))
    let verts = 0
    let indices = 0
    let heads = 0

    function vert(x, y, z, r, g, b, side, along, shape) {
      if (verts >= MAX_VERTS) return -1
      const i = verts++
      rPos[i * 3] = x
      rPos[i * 3 + 1] = y
      rPos[i * 3 + 2] = z
      rCol[i * 3] = r
      rCol[i * 3 + 1] = g
      rCol[i * 3 + 2] = b
      rSide[i] = side
      rAlong[i] = along
      rShape[i] = shape
      return i
    }

    for (let n = 0; n < sparks.length; n++) {
      const s = sparks[n]
      if (!s.alive || s.kind !== 'flash') continue
      const shown = s.fading ? s.frozen : s.age
      const fade = s.fading ? Math.max(0, 1 - s.fadeAge / Math.max(s.fadeDur, 0.001)) : 1
      if (fade <= 0.02) continue
      if (verts + 4 > MAX_VERTS || indices + 6 > MAX_INDICES) continue
      const p = at(s, shown)
      const rad = s.radius * fade
      const c0 = s.r * fade * 1.35
      const c1 = s.g * fade * 1.15
      const c2 = s.b * fade * 0.9
      const a = vert(p.x - rightX * rad - upX * rad, p.y - rightY * rad - upY * rad, p.z - rightZ * rad - upZ * rad, c0, c1, c2, -1, -1, 1)
      vert(p.x + rightX * rad - upX * rad, p.y + rightY * rad - upY * rad, p.z + rightZ * rad - upZ * rad, c0, c1, c2, 1, -1, 1)
      vert(p.x - rightX * rad + upX * rad, p.y - rightY * rad + upY * rad, p.z - rightZ * rad + upZ * rad, c0, c1, c2, -1, 1, 1)
      vert(p.x + rightX * rad + upX * rad, p.y + rightY * rad + upY * rad, p.z + rightZ * rad + upZ * rad, c0, c1, c2, 1, 1, 1)
      rIndex[indices++] = a
      rIndex[indices++] = a + 1
      rIndex[indices++] = a + 2
      rIndex[indices++] = a + 1
      rIndex[indices++] = a + 3
      rIndex[indices++] = a + 2
    }

    for (let n = 0; n < sparks.length; n++) {
      const s = sparks[n]
      if (!s.alive) continue
      const shown = s.fading ? s.frozen : s.age
      const lifeU = Math.min(1, shown / Math.max(s.life, 0.001))
      const lifeFade = lifeU < 0.72 ? 1 : 1 - ((lifeU - 0.72) / 0.28) * 0.8
      let fade = (s.fading ? Math.max(0, 1 - s.fadeAge / s.fadeDur) : 1) * lifeFade
      if (s.kind === 'spark' && lifeU > (s.glitterAt == null ? 0.48 : s.glitterAt)) {
        const start = s.glitterAt == null ? 0.48 : s.glitterAt
        const glitter = (lifeU - start) / Math.max(0.05, 1 - start)
        const blink = Math.abs(Math.sin(time * (16 + s.seed * 34) + s.seed * 28))
        fade *= 1 - glitter + glitter * (0.2 + 0.8 * blink)
      }
      if (fade <= 0.02) continue
      if (s.kind === 'smoke' || s.kind === 'flash') continue

      if (s.ribbon && s.trail > 0 && shown > 0.02 && verts + (SAMPLES + 1) * 2 <= MAX_VERTS && indices + SAMPLES * 6 <= MAX_INDICES) {
        const hotK = s.hot * (1 - Math.min(1, lifeU / 0.22))
        const cr = s.r * (1 - hotK) + hotK
        const cg = s.g * (1 - hotK) + hotK * 0.94
        const cb = s.b * (1 - hotK) + hotK * 0.75
        const base = verts
        const history = s.trail > 1.2
          ? Math.min(s.trail, 1.15 + Math.min(0.5, (s.trail - 1.2) * 0.15))
          : s.trail
        const t0 = Math.max(0, shown - history)
        const span = Math.max(0.02, shown - t0)
        let prevX = 0
        let prevY = 0
        let prevZ = 0
        for (let i = 0; i <= SAMPLES; i++) {
          const along = i / SAMPLES
          const p = at(s, t0 + span * along)
          let tx
          let ty
          let tz
          if (i < SAMPLES) {
            const q = at(s, t0 + span * (i + 1) / SAMPLES)
            tx = q.x - p.x
            ty = q.y - p.y
            tz = q.z - p.z
          } else {
            tx = p.x - prevX
            ty = p.y - prevY
            tz = p.z - prevZ
          }
          prevX = p.x
          prevY = p.y
          prevZ = p.z
          const toX = cam.x - p.x
          const toY = cam.y - p.y
          const toZ = cam.z - p.z
          let sx = ty * toZ - tz * toY
          let sy = tz * toX - tx * toZ
          let sz = tx * toY - ty * toX
          let sl = Math.hypot(sx, sy, sz)
          if (sl < 1e-5) {
            sx = rightX
            sy = rightY
            sz = rightZ
            sl = 1
          }
          sx /= sl
          sy /= sl
          sz /= sl
          const dist = Math.max(8, Math.hypot(toX, toY, toZ))
          const pixels = (7.4 + s.radius * 1.2) * (0.72 + 0.28 * along)
          const half = dist * (pixels * 0.5) / focal
          const tail = 0.05 + 0.95 * along
          const bright = s.bright * fade * tail
          let rr = cr
          let rg = cg
          let rb = cb
          if (s.crown) {
            const k = Math.max(0, (along - 0.58) / 0.42)
            rr = cr * (1 - k) + s.crownR * k
            rg = cg * (1 - k) + s.crownG * k
            rb = cb * (1 - k) + s.crownB * k
          }
          vert(p.x - sx * half, p.y - sy * half, p.z - sz * half, rr * bright, rg * bright, rb * bright, -1, along, 0)
          vert(p.x + sx * half, p.y + sy * half, p.z + sz * half, rr * bright, rg * bright, rb * bright, 1, along, 0)
        }
        for (let i = 0; i < SAMPLES; i++) {
          const a = base + i * 2
          rIndex[indices++] = a
          rIndex[indices++] = a + 1
          rIndex[indices++] = a + 2
          rIndex[indices++] = a + 1
          rIndex[indices++] = a + 3
          rIndex[indices++] = a + 2
        }
      }

      if (s.head && heads < MAX) {
        const p = at(s, shown)
        const dist = Math.max(12, Math.hypot(cam.x - p.x, cam.y - p.y, cam.z - p.z))
        const hot = s.hot * (lifeU < 0.2 ? 1 : 0.25)
        const tipPixels = 7.4 + s.radius * 1.2
        const px = s.trail > 0
          ? tipPixels
          : s.headSize * (1500 / dist)
        headPos[heads * 3] = p.x
        headPos[heads * 3 + 1] = p.y
        headPos[heads * 3 + 2] = p.z
        if (s.trail > 0) {
          let hr = Math.min(1.35, s.r + hot * 0.35)
          let hg = Math.min(1.2, s.g + hot * 0.25)
          let hb = Math.min(1.05, s.b + hot * 0.12)
          if (s.crown && lifeU > 0.12) {
            const k = Math.min(1, (lifeU - 0.12) / 0.18)
            hr = hr * (1 - k) + s.crownR * k
            hg = hg * (1 - k) + s.crownG * k
            hb = hb * (1 - k) + s.crownB * k
          }
          headColor[heads * 3] = hr * fade
          headColor[heads * 3 + 1] = hg * fade
          headColor[heads * 3 + 2] = hb * fade
        } else {
          const k = Math.max(1, s.bright)
          let r = s.r * k + hot * 0.04
          let g = s.g * k + hot * 0.03
          let b = s.b * k + hot * 0.03
          const peak = Math.max(r, g, b, 0.001)
          if (peak > 1.05) {
            const scale = 1.05 / peak
            r *= scale
            g *= scale
            b *= scale
          }
          headColor[heads * 3] = r * fade
          headColor[heads * 3 + 1] = g * fade
          headColor[heads * 3 + 2] = b * fade
        }
        headSize[heads] = px * (s.fading ? 0.7 + 0.3 * fade : 1)
        headSeed[heads] = s.seed
        heads++
      }
    }

    let smokes = 0
    const lights = []
    const flashes = []
    let ambR = 0
    let ambG = 0
    let ambB = 0
    let ambW = 0
    const cells = new Map()
    for (let n = 0; n < sparks.length; n++) {
      const s = sparks[n]
      if (!s.alive || (s.kind !== 'spark' && s.kind !== 'flash')) continue
      const shown = s.fading ? s.frozen : s.age
      const fade = s.fading ? Math.max(0, 1 - s.fadeAge / Math.max(s.fadeDur, 0.001)) : 1
      if (fade < 0.08) continue
      const pos = at(s, shown)
      if (s.kind === 'flash') {
        flashes.push({ x: pos.x, y: pos.y, z: pos.z, w: fade * 2.6 })
        continue
      }
      if (s.senrin && !s.head && !s.ribbon) continue
      const w = fade * Math.max(0.35, s.bright || 1)
      ambR += s.r * w
      ambG += s.g * w
      ambB += s.b * w
      ambW += w
      const key = Math.round(pos.x / 30) + ':' + Math.round(pos.y / 30) + ':' + Math.round(pos.z / 30)
      let cell = cells.get(key)
      if (!cell) {
        cell = { x: 0, y: 0, z: 0, r: 0, g: 0, b: 0, w: 0 }
        cells.set(key, cell)
      }
      cell.x += pos.x * w
      cell.y += pos.y * w
      cell.z += pos.z * w
      cell.r += s.r * w
      cell.g += s.g * w
      cell.b += s.b * w
      cell.w += w
    }
    cells.forEach(cell => {
      lights.push({
        x: cell.x / cell.w,
        y: cell.y / cell.w,
        z: cell.z / cell.w,
        r: cell.r / cell.w,
        g: cell.g / cell.w,
        b: cell.b / cell.w,
        w: Math.min(cell.w, 64)
      })
    })
    const ambMix = ambW > 0 ? Math.min(0.08, ambW / 900) : 0
    const ambColR = ambW > 0 ? ambR / ambW : 0.6
    const ambColG = ambW > 0 ? ambG / ambW : 0.58
    const ambColB = ambW > 0 ? ambB / ambW : 0.56
    for (let n = 0; n < sparks.length; n++) {
      const s = sparks[n]
      if (!s.alive || s.kind !== 'smoke' || smokes >= SMOKE_MAX) continue
      const shown = s.fading ? s.frozen : s.age
      const delay = s.showAfter || 0
      if (shown < delay) continue
      const visible = shown - delay
      const span = Math.max(0.001, s.life - delay)
      const u = Math.min(1, visible / span)
      const fadeT = Math.min(1, visible / (s.fadeInDur || 2.4))
      const fadeIn = fadeT * fadeT * (3 - 2 * fadeT)
      const fadeOut = u < 0.82 ? 1 : Math.max(0, (1 - u) / 0.18)
      const lifeFade = s.fading ? Math.max(0, 1 - s.fadeAge / Math.max(s.fadeDur, 0.001)) : 1
      const alpha = s.bright * fadeIn * fadeOut * lifeFade
      if (alpha < 0.01) continue
      const p = at(s, shown)
      let hueR = s.r
      let hueG = s.g
      let hueB = s.b
      let hueW = 0.25
      if (s.tint) {
        let tintK = 1
        if (s.tintFade > 0 && shown > s.tintHold) {
          tintK = Math.max(0, 1 - (shown - s.tintHold) / s.tintFade)
        }
        hueR = s.tintR * tintK + s.r * (1 - tintK)
        hueG = s.tintG * tintK + s.g * (1 - tintK)
        hueB = s.tintB * tintK + s.b * (1 - tintK)
        hueW = 1.8 * tintK + 0.25 * (1 - tintK)
      } else {
        hueR = ambColR * ambMix + s.r * 0.25
        hueG = ambColG * ambMix + s.g * 0.25
        hueB = ambColB * ambMix + s.b * 0.25
        hueW = ambMix + 0.25
      }
      for (let i = 0; i < lights.length; i++) {
        const L = lights[i]
        const dx = p.x - L.x
        const dy = p.y - L.y
        const dz = p.z - L.z
        const dist2 = dx * dx + dy * dy + dz * dz
        if (dist2 > 120 * 120) continue
        const gain = L.w / (4 + dist2 * 0.003)
        if (gain < 0.12) continue
        hueR += L.r * gain
        hueG += L.g * gain
        hueB += L.b * gain
        hueW += gain
      }
      const amount = hueW > 0 ? Math.min(0.96, hueW / 1.15) : 0
      const cr = hueW > 0.001 ? hueR / hueW : s.r
      const cg = hueW > 0.001 ? hueG / hueW : s.g
      const cb = hueW > 0.001 ? hueB / hueW : s.b
      let lr = Math.min(1, s.r * (1 - amount) + cr * amount)
      let lg = Math.min(1, s.g * (1 - amount) + cg * amount)
      let lb = Math.min(1, s.b * (1 - amount) + cb * amount)
      let white = 0
      for (let i = 0; i < flashes.length; i++) {
        const F = flashes[i]
        const fx = p.x - F.x
        const fy = p.y - F.y
        const fz = p.z - F.z
        white += F.w / (1 + (fx * fx + fy * fy + fz * fz) / 16000)
      }
      white = Math.min(0.72, white)
      lr = lr * (1 - white) + white
      lg = lg * (1 - white) + white
      lb = lb * (1 - white) + white
      const lit = Math.min(0.48, alpha * (1 + white * 2.6))
      const rad = s.radius
      const base = smokes * 4
      const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]]
      for (let k = 0; k < 4; k++) {
        const qx = corners[k][0]
        const qy = corners[k][1]
        const i = base + k
        smokePos[i * 3] = p.x + (rightX * qx + upX * qy) * rad
        smokePos[i * 3 + 1] = p.y + (rightY * qx + upY * qy) * rad
        smokePos[i * 3 + 2] = p.z + (rightZ * qx + upZ * qy) * rad
        smokeCol[i * 4] = lr
        smokeCol[i * 4 + 1] = lg
        smokeCol[i * 4 + 2] = lb
        smokeCol[i * 4 + 3] = lit
        smokeQuad[i * 2] = qx
        smokeQuad[i * 2 + 1] = qy
      }
      smokes++
    }
    smokeGeo.setDrawRange(0, smokes * 6)
    smokeMesh.visible = smokes > 0
    smokeGeo.getAttribute('position').needsUpdate = true
    smokeGeo.getAttribute('color').needsUpdate = true
    smokeGeo.getAttribute('quad').needsUpdate = true

    ribbonGeo.setDrawRange(0, indices)
    ribbonMesh.visible = indices > 0
    ribbonGeo.getAttribute('position').needsUpdate = true
    ribbonGeo.getAttribute('color').needsUpdate = true
    ribbonGeo.getAttribute('side').needsUpdate = true
    ribbonGeo.getAttribute('along').needsUpdate = true
    ribbonGeo.getAttribute('shape').needsUpdate = true
    ribbonGeo.getIndex().needsUpdate = true
    headGeo.setDrawRange(0, heads)
    headGeo.getAttribute('position').needsUpdate = true
    headGeo.getAttribute('color').needsUpdate = true
    headGeo.getAttribute('size').needsUpdate = true
    headGeo.getAttribute('seed').needsUpdate = true
    headMat.uniforms.uTime.value = time
    skyMat.uniforms.flash.value = skyFlash
    groundMat.uniforms.cameraPos.value.copy(camera.position)
    const litFlashes = flashes.slice().sort((a, b) => b.w - a.w)
    for (let i = 0; i < groundFlashes.length; i++) {
      const F = litFlashes[i]
      if (F) groundFlashes[i].set(F.x, F.y, F.z, F.w)
      else groundFlashes[i].set(0, 0, 0, 0)
    }
  }

  function advance(dt) {
    elapsed += dt
    updateWind(elapsed)
    skyFlash = Math.max(0, skyFlash - dt * 2.7)
    fanCooldown = Math.max(0, fanCooldown - dt)

    if (fanQueue) {
      fanQueue.elapsed += dt
      while (fanQueue.index < fanQueue.items.length && fanQueue.items[fanQueue.index].t <= fanQueue.elapsed) {
        const item = fanQueue.items[fanQueue.index++]
        spawnFanBloom(item.x, item.tilt, item.speed)
      }
      if (fanQueue.index >= fanQueue.items.length) fanQueue = null
    }
    if (program) {
      program.elapsed += dt
      while (program.index < program.items.length && program.items[program.index].t <= program.elapsed) {
        const item = program.items[program.index++]
        launch(item.x, item.z, item.recipe, item.tilt, item.az)
      }
      if (program.index >= program.items.length) {
        program = null
        nextAuto = Math.max(nextAuto, bannerUntil - elapsed)
        volleyLeft = 0
      }
    } else if (autoOn) {
      nextAuto -= dt
      if (nextFeature <= 0) {
        startShaku()
        nextFeature = 36 + Math.random() * 18
        nextAuto = 8
        volleyLeft = 0
      } else {
        nextFeature -= dt
        if (volleyLeft > 0) {
          volleyTimer -= dt
          if (volleyTimer <= 0) {
            volleyLeft--
            volleyTimer = 0.32
            launch((Math.random() - 0.5) * 56, (Math.random() - 0.5) * 16)
          }
        }
        if (nextAuto <= 0) {
          const volley = Math.random() < 0.34
          if (volley) {
            volleyLeft += 2 + Math.floor(Math.random() * 2)
            volleyTimer = 0.32
            launch((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 12)
          } else {
            launch((Math.random() - 0.5) * 48, (Math.random() - 0.5) * 16)
          }
          nextAuto = 1.7 + Math.random() * 1.6
        }
      }
    }

    step(dt)
    upload(elapsed)
  }

  function heliLookBand(fovDeg) {
    const half = fovDeg * 0.5 * Math.PI / 180
    const radius = 2000
    const eye = 800
    const low = Math.atan((150 - eye) / radius)
    const high = Math.atan((720 - eye) / radius)
    let minElev = high - half
    let maxElev = low + half
    if (minElev > maxElev) {
      const mid = (low + high) * 0.5
      minElev = mid
      maxElev = mid
    }
    return {
      low: eye + radius * Math.tan(minElev),
      high: eye + radius * Math.tan(maxElev)
    }
  }

  function frameCamera(dt) {
    camera.up.set(0, 1, 0)
    if (camMode === 'drone') {
      const step = Math.min(0.05, Math.max(0, dt || 0))
      const move = 72 * step
      if (keys.has('q')) drone.yaw -= 0.85 * step
      if (keys.has('e')) drone.yaw += 0.85 * step
      if (keys.has('r')) drone.pitch += 0.55 * step
      if (keys.has('f')) drone.pitch -= 0.55 * step
      drone.pitch = Math.min(1.05, Math.max(-0.35, drone.pitch))
      if (keys.has('w')) {
        drone.x += Math.sin(drone.yaw) * move
        drone.z -= Math.cos(drone.yaw) * move
      }
      if (keys.has('s')) {
        drone.x -= Math.sin(drone.yaw) * move
        drone.z += Math.cos(drone.yaw) * move
      }
      if (keys.has('a')) {
        drone.x -= Math.cos(drone.yaw) * move
        drone.z -= Math.sin(drone.yaw) * move
      }
      if (keys.has('d')) {
        drone.x += Math.cos(drone.yaw) * move
        drone.z += Math.sin(drone.yaw) * move
      }
      if (keys.has('t')) drone.y += 48 * step
      if (keys.has('g')) drone.y -= 48 * step
      drone.y = Math.min(900, Math.max(8, drone.y))
      drone.x = Math.min(2200, Math.max(-2200, drone.x))
      drone.z = Math.min(2200, Math.max(-2200, drone.z))
      if (keys.has('z')) drone.zoom = Math.min(1, drone.zoom + 0.32 * step)
      if (keys.has('x')) drone.zoom = Math.max(0, drone.zoom - 0.32 * step)
      camera.fov = 20 + (1 - drone.zoom) * 54
      camera.position.set(drone.x, drone.y, drone.z)
      const cp = Math.cos(drone.pitch)
      camLook.set(
        drone.x + Math.sin(drone.yaw) * cp,
        drone.y + Math.sin(drone.pitch),
        drone.z - Math.cos(drone.yaw) * cp
      )
      camera.lookAt(camLook)
    } else if (camMode === 'heli') {
      const step = Math.min(0.05, Math.max(0, dt || 0))
      heli.angle += step * (Math.PI * 2 / 220)
      if (elapsed >= heli.next) {
        heli.goalFov = 24 + Math.random() * 46
        const band = heliLookBand(heli.goalFov)
        heli.goalLook = band.low + Math.random() * (band.high - band.low)
        heli.next = elapsed + 7 + Math.random() * 9
      }
      heli.fov += (heli.goalFov - heli.fov) * Math.min(1, step * 0.55)
      const band = heliLookBand(heli.fov)
      heli.goalLook = Math.min(band.high, Math.max(band.low, heli.goalLook))
      const outside = heli.look < band.low || heli.look > band.high
      heli.look += (heli.goalLook - heli.look) * Math.min(1, step * (outside ? 1.8 : 0.45))
      const radius = 2000
      const x = Math.sin(heli.angle) * radius
      const z = Math.cos(heli.angle) * radius
      const lookY = heli.look
      const shakeX = Math.sin(elapsed * 1.7) * 22 + Math.sin(elapsed * 4.4) * 7
      const shakeZ = Math.cos(elapsed * 1.45) * 16 + Math.cos(elapsed * 3.6) * 5
      const shakeY = Math.sin(elapsed * 2.2) * 9
      camera.fov = heli.fov
      camera.position.set(x, 800, z)
      camLook.set(shakeX, lookY + shakeY, shakeZ)
      camera.lookAt(camLook)
      camera.rotateZ(Math.sin(elapsed * 1.35) * 0.012 + Math.sin(elapsed * 3.1) * 0.004)
    } else {
      const baseElev = Math.atan((VIEW.lookY - VIEW.eye) / VIEW.distance)
      const maxElev = 40 * Math.PI / 180
      const minElev = 12 * Math.PI / 180
      const elev = Math.min(maxElev, Math.max(minElev, baseElev - pointerY * 22 * Math.PI / 180))
      const yaw = pointerX * 34 * Math.PI / 180
      const cp = Math.cos(elev)
      camera.fov = VIEW.fov
      camera.position.set(0, VIEW.eye, VIEW.distance)
      camLook.set(
        Math.sin(yaw) * cp,
        VIEW.eye + Math.sin(elev),
        VIEW.distance - Math.cos(yaw) * cp
      )
      camera.lookAt(camLook)
    }
    camera.updateProjectionMatrix()
    camera.updateMatrixWorld()
  }

  function animate() {
    const now = performance.now() / 1000
    const dt = Math.min(0.033, Math.max(0, now - last))
    last = now
    frameCamera(dt)
    advance(dt)
    flushSounds()
    renderer.render(scene, camera)
    requestAnimationFrame(animate)
  }

  updateWind(0)
  launch(-18, -4, 0)
  launch(16, 2, 4)

  const previewSeconds = Number(new URLSearchParams(location.search).get('t') || 0)
  if (previewSeconds > 0) {
    const stepDt = 1 / 60
    for (let t = 0; t < previewSeconds; t += stepDt) advance(stepDt)
  }

  animate()
})()
</script>
